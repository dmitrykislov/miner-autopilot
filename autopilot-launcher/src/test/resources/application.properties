# Test-classpath overrides (merged over the main application.yml).
# The history recorder writes real files on disk via its @PostConstruct/@Scheduled beans; keep it
# off for full-context (@SpringBootTest) tests so they don't create a data/ directory. The history
# layer has its own focused unit tests that construct the store directly against a @TempDir.
house.history.enabled=false
# TLS is on by default in production; full-boot tests run over plain HTTP (no cert on the classpath).
server.ssl.enabled=false
# Don't let the login rate limiter trip during multi-login integration tests (it's unit-tested directly).
auth.login-max-per-minute=1000
