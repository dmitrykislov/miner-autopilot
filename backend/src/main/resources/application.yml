server:
  port: ${SERVER_PORT:8080}

# Application version shown in the UI footer. Sourced from the Maven project version
# (pom.xml, the single source of truth) via @...@ resource filtering; override with APP_VERSION.
app:
  version: ${APP_VERSION:@project.version@}

# Access control: a single shared password (as a bcrypt hash) protects every /api/** endpoint.
# Generate a hash with:  htpasswd -bnBC 10 "" 'yourpassword' | tr -d ':\n'
auth:
  enabled: ${AUTH_ENABLED:true}
  password-hash: ${AUTH_PASSWORD_HASH:}     # blank ⇒ fail-closed (all requests rejected)
  token-ttl-days: ${AUTH_TOKEN_TTL_DAYS:30}

spring:
  application:
    name: ${APP_NAME:miner-controller}
  task:
    scheduling:
      pool:
        # One thread per @Scheduled task (inverter poll, consumption poll, energy sampler,
        # autopilot tick, miner) so a blocked I/O poller can never delay the safety-critical
        # autopilot tick.
        size: ${SCHEDULING_POOL_SIZE:5}
  web:
    resources:
      # UI (built React app) is bundled here and served at "/"
      static-locations: ${STATIC_LOCATIONS:classpath:/static/}

# All environment-specific values (hosts/IPs, accounts, passwords, MACs) are driven
# entirely by environment variables with NO hardcoded fallback — set them in .env
# (see .env.example). Only generic, non-identifying protocol defaults (ports,
# intervals, timeouts) carry a sensible default.
house:
  # --- Sungrow SG10RS / WiNet-S dongle: local WebSocket API (wss on 443) ---
  inverter:
    host: ${INVERTER_HOST:}
    port: ${INVERTER_PORT:443}
    ws-path: ${INVERTER_WS_PATH:/ws/home/overview}
    username: ${INVERTER_USERNAME:}
    password: ${INVERTER_PASSWORD:}
    poll-interval-ms: ${INVERTER_POLL_INTERVAL_MS:10000}
    request-timeout-ms: ${INVERTER_REQUEST_TIMEOUT_MS:8000}
  # --- Solar Analytics cloud API: measured whole-home consumption ---
  solar-analytics:
    enabled: ${SOLARANALYTICS_ENABLED:true}
    host: ${SOLARANALYTICS_HOST:https://portal.solaranalytics.com.au/api/v3}
    user: ${SOLARANALYTICS_USER:}
    password: ${SOLARANALYTICS_PASSWORD:}
    # Site id to read; blank = auto-detect the first active site from /site_list.
    site-id: ${SOLARANALYTICS_SITE_ID:}
    poll-interval-ms: ${SOLARANALYTICS_POLL_INTERVAL_MS:15000}
    stale-after-seconds: ${SOLARANALYTICS_STALE_AFTER_SECONDS:60}
    request-timeout-ms: ${SOLARANALYTICS_REQUEST_TIMEOUT_MS:8000}
    # Only call the consumption API when the inverter generates > this many watts
    # (no usable surplus is possible below it, so skip the call when solar is low).
    min-solar-w: ${SOLARANALYTICS_MIN_SOLAR_W:800}
  # --- Braiins OS+ miner (Antminer S19k Pro): local GraphQL API on port 80 ---
  miner:
    enabled: ${MINER_ENABLED:true}
    host: ${MINER_HOST:}
    poll-interval-ms: ${MINER_POLL_INTERVAL_MS:10000}
    request-timeout-ms: ${MINER_REQUEST_TIMEOUT_MS:8000}
    # Optional bearer token if the miner's API requires auth (blank = none).
    auth-token: ${MINER_AUTH_TOKEN:}
    # Hard power-target limits (W) — the miner can't run below min; never exceed max.
    min-power-w: ${MINER_MIN_POWER_W:800}
    max-power-w: ${MINER_MAX_POWER_W:3600}
  # --- Smoothed solar-surplus autopilot: ladder-tracks the time-averaged surplus ---
  # Drives the miner across a power ladder (floor-w .. miner.max-power-w by step-w) to follow the
  # averaged surplus, riding through brief clouds. Ceiling = miner.max-power-w. See AutopilotGovernor.
  autopilot:
    enabled: ${AUTOPILOT_ENABLED:false}              # off by default (controls real hardware)
    interval-ms: ${AUTOPILOT_INTERVAL_MS:30000}      # evaluate + act cadence
    floor-w: ${AUTOPILOT_FLOOR_W:1200}               # lowest run power (≥ miner.min-power-w); below → stop
    step-w: ${AUTOPILOT_STEP_W:400}                  # ladder rung spacing
    headroom-w: ${AUTOPILOT_HEADROOM_W:200}          # anti-import buffer (target ≤ surplus − headroom)
    start-surplus-w: ${AUTOPILOT_START_SURPLUS_W:1600} # surplus to (re)start from off (> floor → hysteresis)
    up-max-rungs-per-cycle: ${AUTOPILOT_UP_MAX_RUNGS:2} # rungs a single up-move may climb
    emergency-gap-w: ${AUTOPILOT_EMERGENCY_GAP_W:800}   # over-draw that bypasses the down interval
    up-interval-ms: ${AUTOPILOT_UP_INTERVAL_MS:900000}    # dampening between up/start (≥ long-window-ms)
    down-interval-ms: ${AUTOPILOT_DOWN_INTERVAL_MS:300000} # between routine down steps
    short-window-ms: ${AUTOPILOT_SHORT_WINDOW_MS:180000}   # avg window for down/stop (fast)
    long-window-ms: ${AUTOPILOT_LONG_WINDOW_MS:900000}     # avg window for up/start (conservative)
    fresh-within-ms: ${AUTOPILOT_FRESH_WITHIN_MS:90000}    # a feed older than this → surplus unknown
    short-coverage-ms: ${AUTOPILOT_SHORT_COVERAGE_MS:60000} # min span for a trusted short average
    long-coverage-ms: ${AUTOPILOT_LONG_COVERAGE_MS:300000}  # min span for a trusted long average

logging:
  level:
    io.dmitrykislov.miner: ${LOG_LEVEL:INFO}
