name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test (backend + UI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The Maven build (exec-maven-plugin) shells out to `npm` to install,
      # build, and test the React UI — so CI needs both a JDK and Node.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Runs the whole backend suite (JUnit/Surefire) + the UI suite (Vitest) and bundles
      # the built UI into the jar. -B = batch/non-interactive.
      - name: Build & test
        run: mvn -B clean install

      - name: Upload jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: miner-autopilot-jar
          path: autopilot-launcher/target/*.jar
          if-no-files-found: warn
          retention-days: 7
